<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">PCI DSS Segmentation Assurance</title>
  <desc id="desc">Enterprise banner showing shared services crossing a claimed cardholder data environment boundary.</desc>
